<!DOCTYPE html>
<html lang="en">
<head><base href="/">
<title>Curated — sovrn.art</title>
<!-- Card and search metadata. Google Sites emitted one og:image for the whole site —
     the studio logo, on every page — and gave no way to change it. Serving these
     pages directly is what makes per-page cards possible at all, so each one names
     its own image, and cards will not render SVG, which is why the share pages point
     at a raster rather than at the artwork they are about. -->
<meta name="description" content="Curated drops by artists who elevate the cryptoart movement. Sovrn’s curation focuses on artists who make powerful contributions to the space, highlighting unique narratives expressed in the…">
<link rel="canonical" href="https://www.sovrn.art/curated">
<meta property="og:type" content="website">
<meta property="og:site_name" content="sovrn.art">
<meta property="og:title" content="Curated">
<meta property="og:description" content="Curated drops by artists who elevate the cryptoart movement. Sovrn’s curation focuses on artists who make powerful contributions to the space, highlighting unique narratives expressed in the…">
<meta property="og:url" content="https://www.sovrn.art/curated">
<meta property="og:image" content="https://www.sovrn.art/img/share/sovrn-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<!-- Rebuilt from the Google Sites page. It restated the collection list by hand, which
     is how two lists of fifteen end up disagreeing; this one is built from
     curated-data.js, the same file the homepage uses. -->
<link rel="stylesheet" href="/tokens.css">
<style>

*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",sans-serif;padding:26px 22px}
.wrap{max-width:1040px;margin:0 auto}
.eyebrow{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1{font:300 clamp(27px,4.6vw,44px)/1.05 Fraunces,serif;margin:13px 0 9px;letter-spacing:-.01em}
.intro{max-width:62ch;color:var(--slate);font-size:14.5px}
.grid{margin-top:26px;padding-top:22px;border-top:1px solid var(--rule);
      display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
.card{display:block;color:inherit;text-decoration:none;border:1px solid var(--rule);
      border-radius:3px;overflow:hidden;background:var(--surface-2);transition:border-color .16s}
.card:hover{border-color:var(--copper)}
/* These are spans inside an <a>, so each one has to be told to be a block:
   left inline, the three lines run together and the square collapses to nothing. */
.card .sq{display:block;position:relative;aspect-ratio:1;overflow:hidden;background:var(--surface-2)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .tx{display:block;padding:11px 12px 13px}
.ti{display:block;font:italic 300 18px/1.25 Fraunces,serif}
.by{display:block;margin-top:4px;font:400 10.5px/1.4 "IBM Plex Mono",monospace;letter-spacing:.05em;color:var(--slate)}
.bl{display:block;margin-top:8px;font-size:13px;line-height:1.5;color:var(--slate)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);
      font:400 11.5px/1.6 "IBM Plex Mono",monospace;color:var(--slate)}
.foot a{color:var(--copper)}

/* Home. Every page that is not the homepage carries this, because a link shared
   into a chat lands on a subpage and there was no way back from twenty-seven of
   them — and where a way existed it was a word in a footer, which is not where
   anyone looks.

   The mark is the logo, top left, at the head of the content rather than floating
   over it: these pages start with a hero image, a banner, an eyebrow or a nav, and
   an overlay that suits one of those covers the others. In flow it never collides. */
.homemark{display:inline-block;line-height:0;margin:0 0 14px;
 border-radius:50%;outline-offset:3px;transition:opacity .15s,transform .15s;opacity:.82}
.homemark:hover,.homemark:focus-visible{opacity:1;transform:scale(1.06)}
.homemark img{width:30px;height:30px;display:block;border-radius:50%}
@media(prefers-reduced-motion:reduce){.homemark{transition:none}}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/transitions.css">
<script src="/transitions.js"></script>
</head>
<body>
<div class="wrap"><a class="homemark" href="/" aria-label="sovrn.art — home" title="sovrn.art"><img src="/img/share/sovrn-mark.webp" alt="" width="30" height="30"></a>
  <p class="eyebrow">sovrn.art</p>
  <h1>Curated</h1>
  <p class="intro">Curated drops by artists who elevate the cryptoart movement.
     Sovrn’s curation focuses on artists who make powerful contributions to the space,
     highlighting unique narratives expressed in the form of serial 1/1 collections.</p>
  <div class="grid" id="grid"></div>
  <p class="foot"><a href="/">sovrn.art</a> · <a href="/collections">In collections</a>
     · <a href="/exhibitions">Exhibitions</a></p>
</div>
<script src="curated-data.js"></script>
<script>
/* Built from the shared list, in the site's own order. Every link carries
   target="_blank": these pages are embedded, and the Sites iframe omits
   allow-top-navigation, so anything else is a dead link (NOTES.md). */
var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); };
document.getElementById("grid").innerHTML = C.map(function (c, i) {
  /* The first row is on screen by definition, and home.html's note applies here
     too: a lazy image never scrolled to is never loaded at all. */
  var lazy = i < 4 ? '' : ' loading="lazy"';
  return '<a class="card" href="' + c[2] + '" target="_blank" rel="noopener">'
       + '<span class="sq"><img src="' + encodeURI(c[3]) + '" alt=""' + lazy + ' decoding="async"></span>'
       + '<span class="tx"><span class="ti">' + esc(c[0]) + '</span>'
       + '<span class="by">' + esc(c[1]) + '</span>'
       + (c[4] ? '<span class="bl">' + esc(c[4]) + '</span>' : '')
       + '</span></a>';
}).join("");
</script>
</body>
</html>
