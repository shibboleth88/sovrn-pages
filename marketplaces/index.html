<!DOCTYPE html>
<html lang="en"><head>
<base href="/">
<title>Marketplaces — sovrn.art</title>
<!-- Card and search metadata. Google Sites emitted one og:image for the whole site —
     the studio logo, on every page — and gave no way to change it. Serving these
     pages directly is what makes per-page cards possible at all, so each one names
     its own image, and cards will not render SVG, which is why the share pages point
     at a raster rather than at the artwork they are about. -->
<meta name="description" content="Where to find each Sovrn collection on the secondary market. Ethereum collections are on Raster; CENTS , inscribed on Bitcoin, is on Ord and Satflow.">
<link rel="canonical" href="https://www.sovrn.art/marketplaces">
<meta property="og:type" content="website">
<meta property="og:site_name" content="sovrn.art">
<meta property="og:title" content="Marketplaces">
<meta property="og:description" content="Where to find each Sovrn collection on the secondary market. Ethereum collections are on Raster; CENTS , inscribed on Bitcoin, is on Ord and Satflow.">
<meta property="og:url" content="https://www.sovrn.art/marketplaces">
<meta property="og:image" content="https://www.sovrn.art/img/share/sovrn-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><!-- Relative paths resolve from the site root, so a page can sit at any depth
     without its assets being rewritten. <base> also rewrites in-page anchors,
     so an in-page anchor must be built from location.pathname. --><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#e9e9e5;--ink:#16181d;--slate:#5c6470;--rule:#c9c9c2;--copper:#8a4f2a}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",sans-serif;padding:26px 22px}
.wrap{max-width:1060px;margin:0 auto}
h1{font:300 clamp(26px,4.4vw,40px)/1.05 Fraunces,serif;margin-bottom:9px;letter-spacing:-.01em}
.intro{max-width:58ch;color:var(--slate);font-size:14.5px;margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--rule)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 20px;align-items:start}
.card{display:flex;flex-direction:column}
.im{display:block;width:100%;aspect-ratio:1;background:var(--ink);overflow:hidden;margin-bottom:11px}
.im img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .18s}
.lk{display:block;text-decoration:none}
.lk:hover img{opacity:.76}
.ti{display:block;font:italic 300 20px/1.18 Fraunces,serif;margin-bottom:3px}
.ar{display:block;font:400 12.5px/1.4 "IBM Plex Sans",sans-serif;color:var(--slate);margin-bottom:10px}
.mk{display:flex;flex-wrap:wrap;gap:7px}
.mk a{display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);border:1px solid var(--rule);padding:5px 10px 5px 6px;transition:border-color .15s,color .15s}
.mk a:hover{border-color:var(--copper);color:var(--copper)}
.mk img{width:19px;height:19px;object-fit:contain;display:block}
.mk span{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.09em;text-transform:uppercase}

/* Home. Every page that is not the homepage carries this, because a link shared
   into a chat lands on a subpage and there was no way back from twenty-seven of
   them — and where a way existed it was a word in a footer, which is not where
   anyone looks.

   The mark is the logo, top left, at the head of the content rather than floating
   over it: these pages start with a hero image, a banner, an eyebrow or a nav, and
   an overlay that suits one of those covers the others. In flow it never collides. */
.homemark{display:inline-block;line-height:0;margin:0 0 14px;
 border-radius:50%;outline-offset:3px;transition:opacity .15s,transform .15s;opacity:.82}
.homemark:hover,.homemark:focus-visible{opacity:1;transform:scale(1.06)}
.homemark img{width:30px;height:30px;display:block;border-radius:50%}
@media(prefers-reduced-motion:reduce){.homemark{transition:none}}
</style><link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/transitions.css">
<script src="/transitions.js"></script>
</head><body><div class="wrap"><a class="homemark" href="/" aria-label="sovrn.art — home" title="sovrn.art"><img src="/img/share/sovrn-mark.webp" alt="" width="30" height="30"></a>
<h1>Marketplace links</h1>
<p class="intro">Where to find each Sovrn collection on the secondary market. Ethereum collections are on Raster; <i>CENTS</i>, inscribed on Bitcoin, is on Ord and Satflow.</p>
<div class="grid" id="g"></div>
</div>
<script>
/* A new tab only for somewhere else. Internal links used to need
   target="_blank" because the Sites iframe blocked top navigation; served
   directly, that just litters the browser with tabs. */
const tgt=u=>/^https?:/i.test(u)?' target="_blank" rel="noopener"':"";

const H="/img/homepage/",
P="/img/homepage/",
F="/img/fc/",
R="https://www.raster.art/artwork/";
const IC={raster:"raster.jpg",ord:"ord.png",satflow:"satflow.png"};
const C=[
["CENTS","Rutherford Chang",H+"cent_homepage.jpg",[["Ord","ord","https://ord.net/collection/cents"],["Satflow","satflow","https://www.satflow.com/ordinals/cents"]]],
["Reflection","Pindar Van Arman",F+"reflection_889_layers_smooth.svg",[["Raster","raster",R+"1668009"]]],
["Wunderkammer","Isa Kost",H+"wunderkammer_homepage.gif",[["Raster","raster",R+"2087164"]]],
["Painting with Fire: a history in GANs","Bård Ionson",H+"fire_homepage.jpg",[["Raster","raster",R+"2084394"]]],
["Noctilucent Mementi","Martin Lukas Ostachowski / MLO.art",H+"mementi_homepage.jpg",[["Raster","raster",R+"2087167"]]],
["Possibility Spaces","Look Highward",H+"possibility_spaces_homepage.jpg",[["Raster","raster",R+"2643128"]]],
["Sightseers: Perimeter Town","Norman Harman",H+"perimeter_town_homepage.jpg",[["Raster","raster",R+"1665657"]]],
["Seasons of Mobility","bashobits",H+"seasons-of-mobility.jpg",[["Raster","raster",R+"2155303"]]],
["Latent Couture","Mikey Woodbridge",H+"latent_couture_homepage.jpg",[["Raster","raster",R+"2793860"]]],
["byteGANs","Pindar Van Arman",H+"bytegan 842.svg",[["Raster","raster",R+"1663395"]]],
["RABBIT TAKEOVER","Anne Spalter",H+"rabbit_takeover_homepage.jpg",[["Raster","raster",R+"2793858"]]],
["SIGHTSEERS","Norman Harman",H+"sightseers_homepage.jpg",[["Raster","raster",R+"1665350"]]],
["cope. Vol 1","aleqth",P+"cope-vol-1.jpg",[["Raster","raster",R+"1663471"]]],
["AI Spaceships","Anne Spalter",H+"ai-spaceships.jpg",[["Raster","raster",R+"1574321"]]]];
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
document.getElementById("g").innerHTML=C.map(c=>{
const im='<span class="im"><img src="'+encodeURI(c[2])+'" alt="'+esc(c[0])+'" width="500" height="500" loading="lazy"></span>',
one=c[3].length==1;
return '<div class="card">'+(one?'<a class="lk" href="'+c[3][0][2]+'"'+tgt(c[3][0][2])+'>'+im+'</a>':im)+'<span class="ti">'+esc(c[0])+'</span><span class="ar">'+esc(c[1])+'</span><span class="mk">'+
c[3].map(m=>'<a href="'+m[2]+'"'+tgt(m[2])+'><img src="'+encodeURI(H+IC[m[1]])+'" alt=""><span>'+m[0]+'</span></a>').join("")+
'</span></div>';}).join("");
</script></body></html>
