<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved — sovrn.art</title>
<!-- This page used to live here, and other sites embed and link these paths:
     vanarman.com carries share-reflection.html in an iframe, and every link ever
     posted points at whatever URL was current that day. GitHub Pages cannot emit
     a 301, so this is the shape it supports — a canonical for search engines and
     a refresh for people. One hop, fixed destination, never taken from a query
     parameter: that is the difference between a redirect and an open redirect.
     The query string is carried across, because share.html?c=reflection has to
     land on the scoped page and not the combined one. -->
<link rel="canonical" href="https://www.sovrn.art/cents/project-description">
<meta http-equiv="refresh" content="0; url=/cents/project-description">
<meta name="robots" content="noindex">
<script>location.replace("/cents/project-description" + location.search + location.hash);</script>
</head>
<body><p>This page has moved to <a href="/cents/project-description">/cents/project-description</a>.</p></body>
</html>
