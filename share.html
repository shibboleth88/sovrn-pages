<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share an artwork — sovrn.art</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16181d;--paper:#e9e9e5;--rule:#c9c9c2;--slate:#5c6470;
        --accent:#2c7a74;--on-accent:#f6f4f0;--card:#f4f4f1}
  @media (prefers-color-scheme:dark){
    :root{--ink:#e6e6e1;--paper:#16181d;--rule:#33373f;--slate:#9aa1ad;
          --accent:#5cc2ba;--on-accent:#10201e;--card:#1d2027}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
  header{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
  h1{margin:0;font:italic 300 clamp(21px,3vw,28px)/1.15 Fraunces,Georgia,serif}
  header p{margin:6px 0 0;font:400 11.5px/1.5 "IBM Plex Mono",monospace;color:var(--slate)}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}
  .find{margin:16px 0 0}
  .find input{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;
    background:var(--card);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans",system-ui,sans-serif;outline:none}
  .find input:focus{border-color:var(--accent)}
  .sets{display:flex;flex-wrap:wrap;gap:7px;padding:12px 0 0}
  .sets button{background:transparent;border:1px solid var(--rule);color:var(--slate);
    font:400 12.5px/1.4 "IBM Plex Sans",sans-serif;padding:7px 13px;border-radius:999px;
    cursor:pointer;transition:border-color .12s,color .12s}
  .sets button:hover{border-color:var(--accent);color:var(--accent)}
  .sets button[aria-pressed=true]{border-color:var(--accent);color:var(--on-accent);
    background:var(--accent)}
  .hits{margin:14px 0 0;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
  .hits:empty{display:none}
  .hits button{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
    width:100%;text-align:left;background:transparent;border:none;
    border-bottom:1px solid var(--rule);padding:10px 14px;cursor:pointer;color:var(--ink);
    font:400 14px/1.4 "IBM Plex Sans",system-ui,sans-serif}
  .hits button:last-child{border-bottom:none}
  .hits button:hover{background:var(--paper);color:var(--accent)}
  .hits button:disabled{cursor:default;color:var(--slate);font-style:italic}
  .hits .tag{flex:none;font:400 11px/1.4 "IBM Plex Mono",monospace;color:var(--slate)}
  .note{color:var(--slate);font:italic 400 14px/1.6 "IBM Plex Sans",sans-serif;
        padding:26px 0 8px;margin:0}
  .more{font:400 11.5px/1.5 "IBM Plex Mono",monospace;color:var(--slate);
        padding:10px 14px;margin:0;border-top:1px solid var(--rule)}
  .panel{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--rule);
         padding:14px 20px calc(14px + env(safe-area-inset-bottom));margin-top:26px}
  .panel .wrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .preview{flex:none;width:132px;height:132px;border:1px solid var(--rule);background:var(--paper);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .preview img{max-width:100%;max-height:100%;display:block}
  .controls{flex:1;min-width:260px}
  .controls h2{margin:0 0 2px;font:500 15px/1.3 "IBM Plex Sans",sans-serif}
  .meta{font:400 11.5px/1.6 "IBM Plex Mono",monospace;color:var(--slate);margin:0 0 10px}
  .meta b{color:var(--ink);font-weight:500}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font:400 11.5px/1 "IBM Plex Mono",monospace;color:var(--slate);
        display:flex;gap:6px;align-items:center;cursor:pointer}
  select{font:400 12px "IBM Plex Sans",sans-serif;padding:6px 8px;border:1px solid var(--rule);
         border-radius:6px;background:var(--paper);color:var(--ink)}
  .go{border:none;background:var(--accent);color:var(--on-accent);border-radius:8px;
      padding:9px 18px;font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;
      text-transform:uppercase;cursor:pointer}
  .go:disabled{opacity:.45;cursor:default}
  .ghost{background:transparent;border:1px solid var(--rule);color:var(--slate)}
  .ghost:hover{border-color:var(--accent);color:var(--accent)}
  .warn{font:400 11.5px/1.5 "IBM Plex Mono",monospace;color:var(--accent);margin:9px 0 0}
</style>
</head>
<body>

<header><div class="wrap">
  <h1>Share an artwork</h1>
  <p>pick a work · get a shareable format</p>
</div></header>

<div class="wrap">
  <div class="find">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search works by title…" aria-label="Search works by title">
  </div>
  <div class="sets" id="sets" role="group" aria-label="Limit to a collection"></div>
  <div class="hits" id="hits" role="listbox"></div>
  <p class="note" id="note">Search by title — “skull”, “beetle”, “cogito”, “octoGAN”.</p>
</div>

<div class="panel" hidden id="panel"><div class="wrap">
  <div class="preview"><img id="prev" alt=""></div>
  <div class="controls">
    <h2 id="pt">—</h2>
    <p class="meta" id="pm"></p>
    <div class="row">
      <label>size
        <select id="size">
          <option value="1200">1200px</option>
          <option value="1600">1600px</option>
          <option value="2048">2048px</option>
        </select>
      </label>
      <button class="go" id="dl">Download</button>
      <button class="go ghost" id="src">Original SVG</button>
    </div>
    <p class="warn" id="warn"></p>
  </div>
</div></div>

<script>
// These three collections keep their artwork in the contract: tokenURI(id)
// returns base64 JSON whose image is a base64 SVG. Nothing comes from a gateway,
// and a data: URI does not taint the canvas, so every work here can be previewed
// and exported. Sovrn's other eleven collections keep their images on IPFS,
// which would taint the canvas and break export — which is why this tool covers
// the on-chain three.
var BASE = location.pathname.replace(/[^/]*$/, "");
var RPC = "https://ethereum-rpc.publicnode.com";
var MAX_HITS = 40;
var LABELS = { reflection: "Reflection", wunderkammer: "Wunderkammer", bytegans: "byteGANs" };
var ARTISTS = { reflection: "Pindar Van Arman", wunderkammer: "Isa Kost",
                bytegans: "Pindar Van Arman" };
var ORDER = ["reflection", "wunderkammer", "bytegans"];

var data = null, scope = null, sel = null, cache = {};
var $ = function (id) { return document.getElementById(id); };

fetch(BASE + "onchain-titles.json")
  .then(function (r) { return r.json(); })
  .then(function (d) { data = d.collections; boot(); })
  .catch(function () { $("note").textContent = "Couldn't load the title index."; });

function boot() {
  var strip = $("sets");
  [""].concat(ORDER).forEach(function (slug) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = slug ? LABELS[slug] + " (" + data[slug].count + ")" : "All";
    b.setAttribute("aria-pressed", String(slug === ""));
    b.onclick = function () { scope = slug || null; mark(); search($("q").value.trim()); };
    b._slug = slug;
    strip.appendChild(b);
  });
  var total = ORDER.reduce(function (n, k) { return n + data[k].count; }, 0);
  $("q").placeholder = "Search " + total.toLocaleString() + " works by title…";
}

function mark() {
  [].forEach.call($("sets").children, function (b) {
    b.setAttribute("aria-pressed", String((b._slug || null) === scope));
  });
}

$("q").addEventListener("input", function () { search(this.value.trim()); });

function search(q) {
  var box = $("hits");
  box.textContent = "";
  if (!q) { $("note").hidden = false; return; }
  $("note").hidden = true;

  var lower = q.toLowerCase();
  var slugs = scope ? [scope] : ORDER;
  var rows = [], total = 0;

  slugs.forEach(function (slug) {
    var rec = data[slug];
    for (var i = 0; i < rec.titles.length; i++) {
      if (rec.titles[i].toLowerCase().indexOf(lower) < 0) continue;
      total++;
      if (rows.length < MAX_HITS) {
        rows.push({ slug: slug, id: rec.first_token + i, title: rec.titles[i] });
      }
    }
  });

  if (!rows.length) {
    var none = document.createElement("button");
    none.type = "button";
    none.disabled = true;
    none.textContent = "Nothing matched that.";
    box.appendChild(none);
    return;
  }

  rows.forEach(function (r) {
    var b = document.createElement("button");
    b.type = "button";
    var t = document.createElement("span");
    t.textContent = r.title;
    var tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = LABELS[r.slug] + " · " + r.id;
    b.appendChild(t);
    b.appendChild(tag);
    b.onclick = function () { openWork(r); };
    box.appendChild(b);
  });

  // Never let a capped list read as the whole answer.
  if (total > rows.length) {
    var more = document.createElement("p");
    more.className = "more";
    more.textContent = total.toLocaleString() + " works match — showing the first "
      + rows.length + ". Keep typing to narrow it.";
    box.appendChild(more);
  }
}

/* ---------------------------------------------------- one work, from chain */

function openWork(r) {
  sel = { slug: r.slug, id: r.id, title: r.title };
  $("panel").hidden = false;
  $("pt").textContent = r.title;
  $("pm").innerHTML = "<b>" + LABELS[r.slug] + "</b> · " + ARTISTS[r.slug]
    + " · token " + r.id + " · reading the contract…";
  $("warn").textContent = "";
  $("prev").removeAttribute("src");
  $("dl").disabled = true;
  $("src").disabled = true;

  fetchWork(r.slug, r.id).then(function (uri) {
    if (!sel || sel.slug !== r.slug || sel.id !== r.id) return;  // superseded
    sel.uri = uri;
    $("prev").src = uri;
    $("dl").disabled = false;
    $("src").disabled = false;
    describe(sel);
  }).catch(function (e) {
    $("pm").innerHTML = "<b>" + LABELS[r.slug] + "</b> · token " + r.id;
    $("warn").textContent = "Couldn't read that work from the contract — "
      + (e && e.message ? e.message : "try again in a moment") + ".";
  });
}

function describe(w) {
  $("pm").innerHTML = "<b>" + LABELS[w.slug] + "</b> · " + ARTISTS[w.slug]
    + " · token " + w.id + " · on-chain";
  var msgs = ["This work moves. The download is a single frame — for the animation, "
    + "use tools/share.py in the sovrn-bot repo, which renders it to GIF. "
    + "“Original SVG” downloads the artwork exactly as the contract stores it."];
  if (w.slug === "reflection") {
    // Reflection is 0-indexed while the other two are 1-indexed, so this is
    // worth saying out loud rather than leaving as a trap.
    msgs.push("Reflection is 0-indexed: token " + w.id + " is number " + (w.id + 1)
      + " on the artist's list of 999.");
  }
  $("warn").innerHTML = msgs.join("<br><br>");
}

function fetchWork(slug, id) {
  var key = slug + ":" + id;
  if (cache[key]) return Promise.resolve(cache[key]);
  var contract = data[slug].contract;
  var call = "0xc87b56dd" + id.toString(16).padStart(64, "0");   // tokenURI(uint256)
  return fetch(RPC, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_call",
                           params: [{ to: contract, data: call }, "latest"] })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j.error) throw new Error(j.error.message || "call failed");
    var raw = j.result.slice(2);
    var len = parseInt(raw.slice(64, 128), 16);
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = parseInt(raw.substr(128 + i * 2, 2), 16);
    var uri = new TextDecoder().decode(bytes);
    var payload = uri.indexOf("base64,") >= 0 ? b64utf8(uri.split("base64,")[1])
                                              : uri.slice(uri.indexOf(",") + 1);
    var image;
    try {
      image = JSON.parse(payload).image;
    } catch (e) {
      // byteGAN #469's metadata is malformed on-chain — one attributes entry has
      // an unquoted key. The contract is immutable, so read the field directly.
      var m = payload.match(/"image"\s*:\s*"([^"]+)"/);
      if (!m) throw new Error("its metadata could not be read");
      image = m[1];
    }
    if (!image) throw new Error("no image in the token");
    cache[key] = image;
    return image;
  });
}

// atob gives one byte per char; decode as UTF-8 so accented titles survive.
function b64utf8(b64) {
  return new TextDecoder().decode(
    Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }));
}

/* ----------------------------------------------------------------- export */

function grab(href, filename) {
  var a = document.createElement("a");
  a.href = href;
  a.download = filename;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function fileName(w) {
  var s = w.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return w.slug + "-" + w.id + (s ? "-" + s : "");
}

$("src").onclick = function () {
  if (sel && sel.uri) grab(sel.uri, fileName(sel) + ".svg");
};

$("dl").onclick = function () {
  var btn = $("dl");
  btn.disabled = true;
  btn.textContent = "Working";
  render(sel, function (blob, err) {
    btn.disabled = false;
    btn.textContent = "Download";
    if (err || !blob) {
      $("warn").innerHTML = "Couldn't build that file — try “Original SVG” instead.";
      return;
    }
    var url = URL.createObjectURL(blob);
    grab(url, fileName(sel) + ".png");
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  });
};

// A byteGAN is not really a vector: the artwork is an 11x11 animated GIF
// base64'd inside the SVG, and the wrapper only carries image-rendering:
// pixelated. Rasterising the SVG and scaling that up interpolates twice over,
// neither step a whole number, and the pixel grid smears. Pull the GIF out and
// scale it by a whole-number factor instead.
function sourceFor(w, done) {
  var img = new Image();
  img.onload = function () { done(img); };
  img.onerror = function () { done(null); };
  if (w.slug !== "bytegans") { img.src = w.uri; return; }
  try {
    var svg = b64utf8(w.uri.split("base64,")[1]);
    var m = svg.match(/data:image\/gif;base64,[A-Za-z0-9+/=\s]+/);
    img.src = m ? m[0].replace(/\s/g, "") : w.uri;
  } catch (e) {
    img.src = w.uri;
  }
}

function render(w, done) {
  sourceFor(w, function (img) {
    if (!img) { done(null, new Error("load")); return; }
    try {
      var sw = img.naturalWidth, sh = img.naturalHeight;
      var target = parseInt($("size").value, 10);
      var pixelArt = w.slug === "bytegans";
      var dw, dh;
      if (pixelArt) {
        // whole-number upscale only, so every source pixel stays a hard square
        var f = Math.max(1, Math.round(target / Math.max(sw, sh)));
        dw = sw * f; dh = sh * f;
      } else {
        var k = target / Math.max(sw, sh);
        dw = Math.max(1, Math.round(sw * k));
        dh = Math.max(1, Math.round(sh * k));
      }
      var c = document.createElement("canvas");
      c.width = dw; c.height = dh;
      var ctx = c.getContext("2d");
      ctx.imageSmoothingEnabled = !pixelArt;
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, dw, dh);
      ctx.drawImage(img, 0, 0, sw, sh, 0, 0, dw, dh);
      // PNG throughout: these are flat vector and pixel art, and JPEG rings on
      // every hard edge — a byteGAN at q0.92 came back with 142 distinct colours
      // where it should have four.
      c.toBlob(function (b) { done(b, null); }, "image/png");
    } catch (e) {
      done(null, e);
    }
  });
}
</script>
</body>
</html>
