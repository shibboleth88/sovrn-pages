<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share an artwork — sovrn.art</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#16181d;--paper:#e9e9e5;--rule:#c9c9c2;--slate:#5c6470;--copper:#8a4f2a;--card:#f4f4f1}
  @media (prefers-color-scheme:dark){
    :root{--ink:#e6e6e1;--paper:#16181d;--rule:#33373f;--slate:#9aa1ad;--copper:#c8845a;--card:#1d2027}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
  header{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
  h1{margin:0;font:italic 300 clamp(21px,3vw,28px)/1.15 Fraunces,Georgia,serif}
  header p{margin:6px 0 0;font:400 11.5px/1.5 "IBM Plex Mono",monospace;color:var(--slate)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  /* search */
  .find{position:relative;margin:16px 0 4px}
  .find input{width:100%;padding:11px 13px;border:1px solid var(--rule);border-radius:8px;
    background:var(--card);color:var(--ink);
    font:400 14px/1.4 "IBM Plex Sans",system-ui,sans-serif;outline:none}
  .find input:focus{border-color:var(--copper)}
  .hits{margin:8px 0 0;border:1px solid var(--rule);border-radius:8px;background:var(--card);
    max-height:260px;overflow-y:auto}
  .hits:empty{display:none}
  .hits button{display:block;width:100%;text-align:left;background:transparent;border:none;
    border-bottom:1px solid var(--rule);padding:9px 13px;cursor:pointer;color:var(--ink);
    font:400 13.5px/1.4 "IBM Plex Sans",system-ui,sans-serif}
  .hits button:last-child{border-bottom:none}
  .hits button:hover{background:var(--paper);color:var(--copper)}
  .hits .tag{font:400 11px/1 "IBM Plex Mono",monospace;color:var(--slate);margin-left:8px}
  /* collection chips — all visible, no strip to scroll */
  .sets{display:flex;flex-wrap:wrap;gap:7px;padding:14px 0 4px}
  .sets button{background:transparent;border:1px solid var(--rule);
    color:var(--slate);font:400 12.5px/1.4 "IBM Plex Sans",sans-serif;padding:7px 13px;
    border-radius:999px;cursor:pointer;transition:border-color .12s,color .12s}
  .sets button:hover{border-color:var(--copper);color:var(--copper)}
  .sets button[aria-pressed=true]{border-color:var(--copper);color:var(--paper);background:var(--copper)}
  .credit{font:400 11.5px/1.5 "IBM Plex Mono",monospace;color:var(--slate);margin:10px 0 0}
  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;
        padding:14px 0 24px}
  .grid button{padding:0;border:1px solid var(--rule);background:var(--card);cursor:pointer;
    aspect-ratio:1;overflow:hidden;border-radius:2px}
  .grid button:hover{border-color:var(--copper)}
  .grid button[aria-pressed=true]{border-color:var(--copper);outline:1px solid var(--copper)}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  /* Latent Couture is shot tall — a centre crop takes the headpieces off. */
  .grid img.top{object-position:top}
  /* panel */
  .panel{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--rule);
         padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
  .panel .wrap{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .preview{flex:none;width:132px;height:132px;border:1px solid var(--rule);background:var(--paper);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .preview img{max-width:100%;max-height:100%;display:block}
  .controls{flex:1;min-width:260px}
  .controls h2{margin:0 0 2px;font:500 14px/1.3 "IBM Plex Sans",sans-serif}
  .meta{font:400 11.5px/1.6 "IBM Plex Mono",monospace;color:var(--slate);margin:0 0 10px}
  .meta b{color:var(--ink);font-weight:500}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{font:400 11.5px/1 "IBM Plex Mono",monospace;color:var(--slate);
        display:flex;gap:6px;align-items:center;cursor:pointer}
  select{font:400 12px "IBM Plex Sans",sans-serif;padding:6px 8px;border:1px solid var(--rule);
         border-radius:6px;background:var(--paper);color:var(--ink)}
  .go{border:none;background:var(--copper);color:#f6f1ec;border-radius:8px;padding:9px 18px;
      font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
      cursor:pointer}
  .go:disabled{opacity:.45;cursor:default}
  .ghost{background:transparent;border:1px solid var(--rule);color:var(--slate)}
  .ghost:hover{border-color:var(--copper);color:var(--copper)}
  .warn{font:400 11.5px/1.5 "IBM Plex Mono",monospace;color:var(--copper);margin:9px 0 0}
  .empty{color:var(--slate);font-style:italic;padding:40px 0}
</style>
</head>
<body>

<header><div class="wrap">
  <h1>Share an artwork</h1>
  <p>pick a work · get a shareable format</p>
</div></header>

<div class="wrap">
  <div class="find">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search a collection, a Reflection title, or a token id (0–998)…"
           aria-label="Search">
    <div class="hits" id="hits" role="listbox"></div>
  </div>
  <div class="sets" id="sets" role="group" aria-label="Collections"></div>
  <p class="credit" id="credit"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">Loading the library…</p>
</div>

<div class="panel" hidden id="panel"><div class="wrap">
  <div class="preview"><img id="prev" alt=""></div>
  <div class="controls">
    <h2 id="pt">—</h2>
    <p class="meta" id="pm"></p>
    <div class="row">
      <label>size
        <select id="size">
          <option value="1200">1200px</option>
          <option value="1600">1600px</option>
          <option value="2048">2048px</option>
          <option value="0">original</option>
        </select>
      </label>
      <label><input type="checkbox" id="crop"> trim to fit the timeline</label>
      <button class="go" id="dl">Download</button>
      <button class="go ghost" id="src">Original file</button>
    </div>
    <p class="warn" id="warn"></p>
  </div>
</div></div>

<script>
// Artwork is served from the same origin as this page, so the canvas is never
// tainted and toBlob() works. Pulling from raster.art instead would taint it and
// every export would throw. (A data: URI does not taint, which is what lets the
// on-chain Reflection works below export too.)
var BASE = location.pathname.replace(/[^/]*$/, "");
// X shows images between about 4:5 and 16:9 whole; outside that band it crops the
// in-timeline preview. We never pad or alter the work to suit — we just say so.
var MIN_AR = 0.8, MAX_AR = 16 / 9;
var RPC = "https://ethereum-rpc.publicnode.com";
var REFLECTION = "0x5137cfB461d24040F5ce6B85D860c47A24f85412";

var sets = [], cur = null, sel = null, selEl = null;
var reflTitles = null, reflContract = REFLECTION, reflLoading = null;
var $ = function (id) { return document.getElementById(id); };

fetch(BASE + "share-manifest.json")
  .then(function (r) { return r.json(); })
  .then(function (d) { sets = d.sets; boot(); })
  .catch(function () { $("empty").textContent = "Couldn't load the artwork index."; });

function boot() {
  var strip = $("sets");
  sets.forEach(function (s, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = s.title;
    b.setAttribute("aria-pressed", "false");
    b.onclick = function () { pick(i); };
    strip.appendChild(b);
  });
  pick(0);
  // The 999 Reflection titles are a separate 22KB file, pulled once in the
  // background so the first search does not have to wait for it.
  loadReflection();
}

/* ------------------------------------------------------------------ search */

function loadReflection() {
  if (reflTitles) return Promise.resolve(reflTitles);
  if (!reflLoading) {
    reflLoading = fetch(BASE + "reflection-titles.json")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        reflTitles = d.titles;
        reflContract = d.contract || REFLECTION;
        return reflTitles;
      })
      .catch(function () { reflLoading = null; return null; });
  }
  return reflLoading;
}

$("q").addEventListener("input", function () { search(this.value.trim()); });

function search(q) {
  var box = $("hits");
  box.textContent = "";
  if (!q) return;
  var lower = q.toLowerCase();
  var rows = [];

  // a bare number is a Reflection token id
  if (/^\d+$/.test(q)) {
    var n = parseInt(q, 10);
    if (n >= 0 && n <= 998) {
      rows.push(reflRow(n, "token " + n));
    }
    // The artist's list runs 1-999 while token ids run 0-998, so a number off a
    // list or a title card is one higher than the id. Offer both readings.
    if (n >= 1 && n <= 999) {
      rows.push(reflRow(n - 1, "list no. " + n + " — token " + (n - 1)));
    }
  }

  sets.forEach(function (s, i) {
    if (s.title.toLowerCase().indexOf(lower) >= 0 ||
        (s.artist || "").toLowerCase().indexOf(lower) >= 0) {
      rows.push({ label: s.title, tag: s.artist || "collection",
                  go: function () { pick(i); clearSearch(); } });
    }
  });

  if (reflTitles && lower.length >= 2) {
    for (var id = 0; id < reflTitles.length && rows.length < 40; id++) {
      if (reflTitles[id].toLowerCase().indexOf(lower) >= 0) {
        rows.push(reflRow(id, "Reflection · token " + id));
      }
    }
  }

  if (!rows.length) {
    var none = document.createElement("button");
    none.type = "button";
    none.disabled = true;
    none.textContent = "Nothing matched that.";
    box.appendChild(none);
    return;
  }
  rows.slice(0, 40).forEach(function (r) {
    var b = document.createElement("button");
    b.type = "button";
    b.appendChild(document.createTextNode(r.label));
    var t = document.createElement("span");
    t.className = "tag";
    t.textContent = r.tag;
    b.appendChild(t);
    b.onclick = r.go;
    box.appendChild(b);
  });
}

function reflRow(id, tag) {
  var title = reflTitles ? reflTitles[id] : "Reflection #" + id;
  return { label: title, tag: tag, go: function () { openToken(id); } };
}

function clearSearch() { $("q").value = ""; $("hits").textContent = ""; }

/* ------------------------------------------ one Reflection work, from chain */

function openToken(id) {
  clearSearch();
  loadReflection().then(function () {
    var title = reflTitles ? reflTitles[id] : "token " + id;
    cur = { slug: "reflection", title: "Reflection", artist: "Pindar Van Arman",
            animated: true };
    sel = { chain: id, title: title, v: 1 };
    if (selEl) { selEl.setAttribute("aria-pressed", "false"); selEl = null; }
    $("panel").hidden = false;
    // Deliberately leave the grid, the chips and the credit line alone. A work
    // opened from search is a single piece pulled from the contract, not a
    // change of collection — rewriting the credit while the grid still showed
    // another collection just made the two disagree.
    $("pt").textContent = title;
    $("pm").innerHTML = "<b>token " + id + "</b> · list no. " + (id + 1) + " · reading the contract…";
    $("warn").textContent = "";
    $("prev").removeAttribute("src");

    fetchToken(id).then(function (dataUri) {
      sel.uri = dataUri;
      $("prev").src = dataUri;
      describe(sel);
    }).catch(function (e) {
      $("pm").innerHTML = "<b>token " + id + "</b> · list no. " + (id + 1);
      $("warn").textContent = "Couldn't read that work from the contract — "
        + (e && e.message ? e.message : "try again in a moment") + ".";
    });
  });
}

// Reflection is fully on-chain: tokenURI(id) returns base64 JSON whose image is
// a base64 SVG — the artwork itself, no gateway. The RPC allows any origin, so
// this works straight from the browser.
function fetchToken(id) {
  var data = "0xc87b56dd" + id.toString(16).padStart(64, "0");   // tokenURI(uint256)
  return fetch(RPC, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "eth_call",
                           params: [{ to: reflContract, data: data }, "latest"] })
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (j.error) throw new Error(j.error.message || "call failed");
    var raw = j.result.slice(2);
    var len = parseInt(raw.slice(64, 128), 16);
    var bytes = [];
    for (var i = 0; i < len; i++) {
      bytes.push(parseInt(raw.substr(128 + i * 2, 2), 16));
    }
    var uri = new TextDecoder().decode(new Uint8Array(bytes));
    var meta = JSON.parse(uri.indexOf("base64,") >= 0
      ? decodeURIComponent(escape(atob(uri.split("base64,")[1])))
      : uri.slice(uri.indexOf(",") + 1));
    if (!meta.image) throw new Error("no image in the token");
    return meta.image;
  });
}

/* ------------------------------------------------------------- the library */

function pick(i) {
  cur = sets[i];
  [].forEach.call($("sets").children, function (b, n) {
    b.setAttribute("aria-pressed", String(n === i));
  });
  $("credit").textContent = cur.artist ? cur.title + " — " + cur.artist : cur.title;
  $("empty").hidden = true;

  var grid = $("grid");
  grid.textContent = "";
  // Latent Couture is shot tall; crop its thumbnails from the top or the square
  // crop takes the headpieces off.
  var topCrop = cur.slug === "latent-couture";
  cur.works.forEach(function (w) {
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    var im = document.createElement("img");
    im.src = BASE + w.f;
    im.loading = "lazy";
    im.decoding = "async";
    im.alt = "";
    if (topCrop) im.className = "top";
    b.appendChild(im);
    b.onclick = function () { choose(w, b); };
    grid.appendChild(b);
  });
  choose(cur.works[0], grid.firstChild);
}

function choose(w, el) {
  sel = w;
  if (selEl) selEl.setAttribute("aria-pressed", "false");
  selEl = el;
  if (el) el.setAttribute("aria-pressed", "true");
  $("panel").hidden = false;
  $("prev").src = BASE + w.f;
  $("pt").textContent = name(w);
  describe(w);
}

function name(w) {
  if (w.chain !== undefined) {
    return w.title || ("reflection-" + w.chain);
  }
  return w.f.split("/").pop().replace(/\.[^.]+$/, "");
}

function fileName(w) {
  if (w.chain !== undefined) return "reflection-" + w.chain;
  return name(w);
}

function describe(w) {
  var bits = [];
  if (w.chain !== undefined) {
    bits.push("<b>token " + w.chain + "</b>", "list no. " + (w.chain + 1), "on-chain");
  } else if (w.w && w.h) {
    bits.push("<b>" + w.w + "&times;" + w.h + "</b>", ratioName(w.w / w.h));
  } else {
    bits.push("<b>vector</b>");
  }
  $("pm").innerHTML = bits.join(" · ");

  var msgs = [];
  if (w.w && w.h && (w.w / w.h < MIN_AR || w.w / w.h > MAX_AR)) {
    msgs.push("This shape sits outside what X shows whole, so the timeline "
      + "preview will be cropped — the full work still opens on tap. "
      + "Tick “trim to fit” if you would rather choose the crop yourself.");
  }
  if (cur && cur.animated) {
    msgs.push("This work moves. The download is a single frame — for the "
      + "animation, use tools/share.py in the sovrn-bot repo, which renders it "
      + "to GIF. “Original file” gives you the artwork as published.");
  }
  $("warn").innerHTML = msgs.join("<br><br>");
  $("crop").disabled = !(w.w && w.h);
}

function ratioName(ar) {
  if (Math.abs(ar - 1) < 0.03) return "square";
  if (ar > 1.7) return "wide";
  if (ar > 1) return "landscape";
  if (ar > 0.79) return "portrait";
  return "tall";
}

$("size").onchange = $("crop").onchange = function () { if (sel) describe(sel); };

$("src").onclick = function () {
  if (sel.chain !== undefined) {
    if (!sel.uri) return;
    grab(sel.uri, fileName(sel) + ".svg");
    return;
  }
  grab(BASE + sel.f, sel.f.split("/").pop());
};

$("dl").onclick = function () {
  var btn = $("dl");
  btn.disabled = true;
  btn.textContent = "Working";
  render(sel, function (blob, err) {
    btn.disabled = false;
    btn.textContent = "Download";
    if (err || !blob) {
      $("warn").innerHTML = "Couldn't build that file — try “Original file” instead.";
      return;
    }
    var url = URL.createObjectURL(blob);
    grab(url, fileName(sel) + "." + formatFor().ext);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  });
};

function grab(href, filename) {
  var a = document.createElement("a");
  a.href = href;
  a.download = filename;
  a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

/* ------------------------------------------------------------------ export */

// A byteGAN is not really a vector: the artwork is an 11x11 animated GIF
// base64'd inside the SVG, and the wrapper only carries image-rendering:
// pixelated. Rasterising the SVG and scaling that up interpolates twice over
// (11 -> 500 -> target, neither an integer step) and the pixel grid smears.
// Pull the GIF out and scale it by a whole-number factor instead.
function sourceFor(w, done) {
  if (w.chain !== undefined) {
    if (!w.uri) { done(null); return; }
    var ci = new Image();
    ci.onload = function () { done(ci); };
    ci.onerror = function () { done(null); };
    ci.src = w.uri;
    return;
  }
  if (!cur || cur.slug !== "bytegans") {
    var img = new Image();
    img.onload = function () { done(img); };
    img.onerror = function () { done(null); };
    img.src = BASE + w.f;
    return;
  }
  fetch(BASE + w.f).then(function (r) { return r.text(); }).then(function (svg) {
    var m = svg.match(/data:image\/gif;base64,[A-Za-z0-9+/=\s]+/);
    if (!m) { done(null); return; }
    var gi = new Image();
    gi.onload = function () { done(gi); };
    gi.onerror = function () { done(null); };
    gi.src = m[0].replace(/\s/g, "");
  }).catch(function () { done(null); });
}

// Pixel art and flat vector go out as PNG. JPEG rings badly on hard edges — a
// byteGAN exported at q0.92 came back with 142 distinct colours where it should
// have a handful.
function formatFor() {
  return (cur && cur.animated) ? { mime: "image/png", ext: "png", q: undefined }
                               : { mime: "image/jpeg", ext: "jpg", q: 0.92 };
}

function render(w, done) {
  sourceFor(w, function (img) {
    if (!img) { done(null, new Error("load")); return; }
    try {
      var sw = img.naturalWidth, sh = img.naturalHeight;
      var sx = 0, sy = 0;
      if ($("crop").checked && !$("crop").disabled) {
        var ar = sw / sh;
        if (ar < MIN_AR) {                 // too tall -> keep the top
          sh = Math.round(sw / MIN_AR);
        } else if (ar > MAX_AR) {          // too wide -> keep the middle
          var nw = Math.round(sh * MAX_AR);
          sx = Math.round((sw - nw) / 2);
          sw = nw;
        }
      }
      var target = parseInt($("size").value, 10);
      var pixelArt = cur && cur.slug === "bytegans" && w.chain === undefined;
      var dw, dh;
      if (!target) {
        dw = sw; dh = sh;
      } else if (pixelArt) {
        // whole-number upscale only, so every source pixel stays a hard square
        var f = Math.max(1, Math.round(target / Math.max(sw, sh)));
        dw = sw * f; dh = sh * f;
      } else {
        var k = target / Math.max(sw, sh);
        dw = Math.max(1, Math.round(sw * k));
        dh = Math.max(1, Math.round(sh * k));
      }
      var c = document.createElement("canvas");
      c.width = dw; c.height = dh;
      var ctx = c.getContext("2d");
      ctx.imageSmoothingEnabled = !pixelArt;
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, dw, dh);
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);
      var f2 = formatFor();
      c.toBlob(function (b) { done(b, null); }, f2.mime, f2.q);
    } catch (e) {
      done(null, e);
    }
  });
}
</script>
</body>
</html>
