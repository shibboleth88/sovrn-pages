<!-- GitHub Pages serves this for anything it cannot find. Worth having: the site has
     just been reorganised, and while every old path keeps a redirect, someone will
     still arrive somewhere that no longer exists. Better to be handed the way back
     than the host's default. -->
<style>
:root{--paper:#e9e9e5;--ink:#16181d;--slate:#5c6470;--rule:#c9c9c2;--copper:#8a4f2a}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 "IBM Plex Sans",sans-serif;
     min-height:100vh;display:flex;align-items:center;padding:40px 22px}
.wrap{max-width:640px;margin:0 auto}
.eyebrow{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1{font:300 clamp(28px,5vw,46px)/1.06 Fraunces,serif;margin:14px 0 12px;letter-spacing:-.01em}
p{color:var(--slate);max-width:52ch}
ul{margin:26px 0 0;padding:20px 0 0;border-top:1px solid var(--rule);list-style:none;
   display:flex;flex-wrap:wrap;gap:10px 22px}
a{color:var(--copper);font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase}

/* Home. Every page that is not the homepage carries this, because a link shared
   into a chat lands on a subpage and there was no way back from twenty-seven of
   them — and where a way existed it was a word in a footer, which is not where
   anyone looks.

   The mark is the logo, top left, at the head of the content rather than floating
   over it: these pages start with a hero image, a banner, an eyebrow or a nav, and
   an overlay that suits one of those covers the others. In flow it never collides. */
.homemark{display:inline-block;line-height:0;margin:0 0 14px;
 border-radius:50%;outline-offset:3px;transition:opacity .15s,transform .15s;opacity:.82}
.homemark:hover,.homemark:focus-visible{opacity:1;transform:scale(1.06)}
.homemark img{width:30px;height:30px;display:block;border-radius:50%}
@media(prefers-reduced-motion:reduce){.homemark{transition:none}}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
